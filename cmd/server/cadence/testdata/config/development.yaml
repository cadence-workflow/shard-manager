shardDistribution:
  leaderStore:
    storageParams:
      endpoints:
      - ${ETCD_ENDPOINTS:"localhost:2379"}
  store:
    storageParams:
      endpoints:
        - ${ETCD_ENDPOINTS:"localhost:2379"}
  election:
    leaderPeriod: 30s
    maxRandomDelay: 5s
    failedElectionCooldown: 30s
  namespaces:
    - name: cadence-matching-dev
      type: ephemeral
  process:
    period: 2s

rpc:
  grpcPort: 7943
  bindOnLocalHost: true

metrics:
  statsd:
    hostPort: "127.0.0.1:8125"
    prefix: "cadence"

pprof:
  port: 7942

clusterGroupMetadata:
  currentClusterName: "cluster0"
