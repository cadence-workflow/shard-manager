services:
  etcd:
    image: bitnamilegacy/etcd:3.5.5
    ports:
      - "2379:2379"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 5s
      retries: 15

  shard-manager:
    build: .
    image: shard-manager:local
    ports:
      - "7943:7943"
    depends_on:
      etcd:
        condition: service_healthy
