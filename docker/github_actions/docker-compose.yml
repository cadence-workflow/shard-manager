services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.15
    restart: always
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      # etcd runs without authentication, so only expose it on the host's loopback
      - "127.0.0.1:2379:2379"
    networks:
      services-network:
        aliases:
          - etcd

networks:
  services-network:
    name: services-network
    driver: bridge
