syntax = "proto3";

package uber.cadence.sharddistributor.v1;

option go_package = "github.com/cadence-workflow/shard-manager/.gen/proto/sharddistributor/v1;sharddistributorv1";

// ShardDistributorExecutionAPI is used update the state of the executor and fetch the next shard assignments.
service ShardDistributorExecutorAPI {

  // Heartbeat reports the current state of the executor, and fetches the next shard assignments.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message HeartbeatRequest {
  string namespace = 1;
  string executor_id = 2;
  ExecutorStatus status = 3;
  map<string, ShardStatusReport> shard_status_reports = 4;
  map<string, string> metadata = 5;
  reserved 6;
  reserved "host_id";
  HostMetadata host_metadata = 7;
  // Keyed by range ID and replaces shard_status_reports in range mode.
  map<string, RangeLoadReport> range_load_reports = 8;
}

// HostMetadata carries host-level attributes reported on each heartbeat
message HostMetadata {
  string host_name = 1;
}

enum ExecutorStatus {
  EXECUTOR_STATUS_INVALID = 0;
  EXECUTOR_STATUS_ACTIVE = 1;
  EXECUTOR_STATUS_DRAINING = 2;
  EXECUTOR_STATUS_DRAINED = 3;
}

message ShardStatusReport {
  ShardStatus status = 1;
  double shard_load = 2;
}

// We only have one status for now, but when adding
// graceful handover, we will need to add more statuses.
// We do not need an "inactive" status, as we will not include
// inactive shards in the heartbeat request.
enum ShardStatus {
  SHARD_STATUS_INVALID = 0;
  SHARD_STATUS_READY = 1;
  SHARD_STATUS_DONE = 2;
}



message HeartbeatResponse {
  map<string, ShardAssignment> shard_assignments = 1;
  MigrationMode migration_mode = 2;
  repeated RangeAssignment range_assignments = 3;
}

message ShardAssignment {
  AssignmentStatus status = 1;
}

// We only have one status for now, but when adding
// graceful handover, we will need to add more statuses.
// We do not need an "inactive" status, as we will not include
// inactive shards in the heartbeat request.
enum AssignmentStatus {
  ASSIGNMENT_STATUS_INVALID = 0;
  ASSIGNMENT_STATUS_READY = 1;
}

// We handle  the migration steps from SD side
enum MigrationMode {
  reserved 2, 3;
  reserved "MIGRATION_MODE_LOCAL_PASSTHROUGH_SHADOW", "MIGRATION_MODE_DISTRIBUTED_PASSTHROUGH";
  MIGRATION_MODE_INVALID = 0;
  MIGRATION_MODE_LOCAL_PASSTHROUGH = 1;
  MIGRATION_MODE_ONBOARDED = 4;
}

message Range {
  bytes low_inclusive = 1;
  // Empty means the range extends to the end of the key space.
  bytes high_exclusive = 2;
}

message RangeAssignment {
  string id = 1;
  Range range = 2;
  string executor_id = 3;
  AssignmentStatus status = 4;
}

message RangeLoadReport {
  double range_load = 1;
  // Unordered bounded top-N by tasklist name.
  map<string, double> top_tasklists = 2;
}
